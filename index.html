<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartão Fidelidade Premium</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:
radial-gradient(circle at top left,#f3e8ff,#d8b4fe 35%,transparent 65%),
linear-gradient(180deg,#faf5ff,#d8b4fe,#a855f7);
color:#3b0764;
min-height:100vh;
}

.hidden{display:none!important}

.tela{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:25px;
}

.box,.card{
background:rgba(255,255,255,.90);
border-radius:32px;
padding:25px;
box-shadow:0 16px 38px rgba(126,34,206,.22);
border:1px solid rgba(255,255,255,.85);
}

.box{
width:100%;
max-width:430px;
text-align:center;
}

.container{
max-width:520px;
margin:auto;
padding:22px;
min-height:100vh;
}

.logo{
font-size:56px;
text-align:center;
color:#7e22ce;
}

h1,h2{
text-align:center;
color:#7e22ce;
margin-top:10px;
}

.sub{
text-align:center;
color:#6b21a8;
font-weight:bold;
margin-top:8px;
}

label{
display:block;
margin-top:13px;
font-weight:bold;
color:#581c87;
}

input{
width:100%;
padding:14px;
margin-top:7px;
border-radius:18px;
border:1px solid #c084fc;
background:#fff;
font-size:15px;
}

button{
border:none;
cursor:pointer;
font-weight:bold;
}

.btn{
width:100%;
padding:15px;
margin-top:15px;
border-radius:22px;
background:linear-gradient(135deg,#7e22ce,#c084fc,#e9d5ff);
color:white;
font-size:16px;
box-shadow:0 8px 22px rgba(126,34,206,.30);
}

.btn-light{
background:#faf5ff;
color:#7e22ce;
border:1px solid #d8b4fe;
}

.form-card{
margin-top:18px;
}

.cartao{
background:
linear-gradient(135deg,#ffffff,#f4e8ff,#e9d5ff);
border:2px solid #c084fc;
border-radius:30px;
padding:22px;
margin-top:22px;
box-shadow:0 16px 35px rgba(126,34,206,.25);
position:relative;
overflow:hidden;
}

.cartao::after{
content:"VIP";
position:absolute;
right:-8px;
top:8px;
font-size:58px;
font-weight:bold;
color:rgba(126,34,206,.07);
}

.selo{
display:inline-block;
background:linear-gradient(135deg,#7e22ce,#c084fc);
color:white;
padding:7px 14px;
border-radius:999px;
font-size:12px;
font-weight:bold;
letter-spacing:1px;
}

.nomeCliente{
font-size:28px;
font-weight:bold;
color:#581c87;
text-align:center;
margin-top:12px;
}

.premioBox{
background:#faf5ff;
border:1px solid #d8b4fe;
border-radius:20px;
padding:12px;
text-align:center;
margin-top:14px;
color:#6b21a8;
font-weight:bold;
}

.estrelas{
display:flex;
justify-content:center;
gap:12px;
margin-top:22px;
}

.estrela{
width:50px;
height:50px;
border-radius:50%;
border:2px solid #a855f7;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
background:white;
color:#d8b4fe;
box-shadow:0 5px 12px rgba(126,34,206,.12);
}

.estrela.cheia{
background:linear-gradient(135deg,#7e22ce,#c084fc);
color:white;
box-shadow:0 0 18px rgba(126,34,206,.45);
}

.contador{
text-align:center;
font-size:20px;
font-weight:bold;
color:#581c87;
margin-top:16px;
}

.barra{
height:12px;
background:#eadbff;
border-radius:999px;
overflow:hidden;
margin-top:12px;
}

.progresso{
height:100%;
width:0%;
background:linear-gradient(135deg,#7e22ce,#c084fc);
border-radius:999px;
transition:.3s;
}

.acoes{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:16px;
}

.acoes button{
padding:12px;
border-radius:16px;
font-size:14px;
}

.avisoPremio{
background:linear-gradient(135deg,#7e22ce,#c084fc);
color:white;
border-radius:20px;
padding:13px;
margin-top:15px;
text-align:center;
font-weight:bold;
box-shadow:0 8px 20px rgba(126,34,206,.25);
}

.delete{
background:#be123c;
color:white;
padding:12px;
border-radius:16px;
margin-top:12px;
width:100%;
}

footer{
text-align:center;
font-size:12px;
color:#581c87;
margin-top:22px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="tela" id="login">
  <div class="box">
    <div class="logo">✦</div>
    <h1>Cartão Fidelidade Premium</h1>
    <p class="sub">Cartões digitais VIP para suas clientes</p>

    <label>Senha</label>
    <input type="password" id="senha" placeholder="Digite a senha">

    <button class="btn" onclick="entrar()">Entrar</button>
  </div>
</div>

<div class="container hidden" id="app">

  <div class="logo">✦</div>
  <h1>Cartão Fidelidade Premium</h1>
  <p class="sub">Crie cartões e marque as visitas das clientes</p>

  <div class="card form-card">
    <h2>Novo cliente VIP</h2>

    <label>Nome da cliente</label>
    <input type="text" id="nomeCliente" placeholder="Ex: Maria Eduarda">

    <label>Prêmio ao completar</label>
    <input type="text" id="premioCliente" placeholder="Ex: Manutenção grátis">

    <button class="btn" onclick="adicionarCliente()">Criar cartão VIP</button>
  </div>

  <div id="listaCartoes"></div>

  <footer>Cartão Fidelidade Premium ✦</footer>

</div>

<script>
let clientes = JSON.parse(localStorage.getItem("cartaoFidelidadePremium")) || [];

function entrar(){
  let senha = document.getElementById("senha").value;

  if(senha === "chocolate333"){
    document.getElementById("login").style.display="none";
    document.getElementById("app").classList.remove("hidden");
    renderizar();
  }else{
    alert("Senha incorreta.");
  }
}

function salvar(){
  localStorage.setItem("cartaoFidelidadePremium", JSON.stringify(clientes));
}

function adicionarCliente(){
  let nome = document.getElementById("nomeCliente").value;
  let premio = document.getElementById("premioCliente").value;

  if(!nome){
    alert("Digite o nome da cliente.");
    return;
  }

  clientes.push({
    nome,
    premio: premio || "Prêmio liberado",
    estrelas:0
  });

  salvar();

  document.getElementById("nomeCliente").value="";
  document.getElementById("premioCliente").value="";

  renderizar();
}

function adicionarEstrela(index){
  if(clientes[index].estrelas < 5){
    clientes[index].estrelas++;
  }
  salvar();
  renderizar();
}

function removerEstrela(index){
  if(clientes[index].estrelas > 0){
    clientes[index].estrelas--;
  }
  salvar();
  renderizar();
}

function excluirCliente(index){
  if(confirm("Excluir esse cartão?")){
    clientes.splice(index,1);
    salvar();
    renderizar();
  }
}

function renderizar(){
  let lista = document.getElementById("listaCartoes");
  lista.innerHTML = "";

  if(clientes.length === 0){
    lista.innerHTML = "<p class='sub' style='margin-top:20px;'>Nenhum cartão criado ainda.</p>";
    return;
  }

  clientes.forEach((c,index)=>{
    let estrelas = "";

    for(let i=1;i<=5;i++){
      estrelas += `<div class="estrela ${i <= c.estrelas ? "cheia" : ""}">★</div>`;
    }

    let porcentagem = (c.estrelas / 5) * 100;

    lista.innerHTML += `
      <div class="cartao">
        <span class="selo">CLIENTE VIP</span>

        <div class="nomeCliente">${c.nome}</div>

        <div class="premioBox">
          PRÊMIO: ${c.premio}
        </div>

        <div class="estrelas">${estrelas}</div>

        <div class="contador">${c.estrelas}/5 visitas</div>

        <div class="barra">
          <div class="progresso" style="width:${porcentagem}%"></div>
        </div>

        ${c.estrelas >= 5 ? `<div class="avisoPremio">Prêmio liberado!</div>` : ""}

        <div class="acoes">
          <button class="btn" onclick="adicionarEstrela(${index})">+ Visita</button>
          <button class="btn btn-light" onclick="removerEstrela(${index})">- Visita</button>
        </div>

        <button class="delete" onclick="excluirCliente(${index})">Excluir cartão</button>
      </div>
    `;
  });
}
</script>

</body>
</html>
